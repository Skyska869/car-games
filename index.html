 <!DOCTYPE html> <html lang="ru"> <head>     <meta charset="UTF-8">     <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">     <title>Car Case Opener</title>     <script src="https://telegram.org/js/telegram-web-app.js"></script>     <style>         :root {             --bg-color: #1a1a1a;             --card-color: #2d2d2d;             --accent-color: #ffcc00;             --text-color: #ffffff;             --common: #b5b5b5;             --rare: #3498db;             --epic: #9b59b6;             --legendary: #f1c40f;         }          body {             font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;             background-color: var(--bg-color);             color: var(--text-color);             margin: 0;             padding: 0;             display: flex;             flex-direction: column;             align-items: center;             user-select: none;         }          #app {             width: 100%;             max-width: 500px;             padding: 20px;             box-sizing: border-box;         }          .header {             text-align: center;             margin-bottom: 20px;             background: var(--card-color);             padding: 15px;             border-radius: 15px;             box-shadow: 0 4px 10px rgba(0,0,0,0.3);         }          .balance {             font-size: 24px;             font-weight: bold;             color: var(--accent-color);         }          .stats {             font-size: 12px;             opacity: 0.7;         }          .section-title {             margin: 20px 0 10px;             font-size: 18px;             border-left: 4px solid var(--accent-color);             padding-left: 10px;         }          .cases-grid {             display: grid;             grid-template-columns: 1fr 1fr;             gap: 15px;         }          .case-card {             background: var(--card-color);             border-radius: 15px;             padding: 15px;             text-align: center;             transition: transform 0.2s;             cursor: pointer;             border: 1px solid #444;         }          .case-card:active {             transform: scale(0.95);         }          .case-card img {             width: 60px;             height: 60px;             margin-bottom: 10px;         }          .case-name {             font-weight: bold;             display: block;             margin-bottom: 5px;         }          .case-price {             color: var(--accent-color);             font-size: 14px;         }          /* Modal & Animation */         #overlay {             display: none;             position: fixed;             top: 0; left: 0; width: 100%; height: 100%;             background: rgba(0,0,0,0.9);             z-index: 100;             flex-direction: column;             align-items: center;             justify-content: center;         }          .spinner {             width: 300px;             height: 100px;             border: 2px solid var(--accent-color);             position: relative;             overflow: hidden;             margin: 20px 0;             background: #111;         }          .item-strip {             display: flex;             position: absolute; { name: "Mercedes G-Class", rarity: "epic", chance: 15, emoji: "🚙" }, { name: "Maybach", rarity: "legendary", chance: 5, emoji: "💎" } ] };
const prices = { ru: 1500, de: 5000, ger: 15000 };  // Обновление UI function updateUI() {     document.getElementById('balance-display').innerText = `${gameState.balance.toLocaleString()} ₽`;     document.getElementById('car-count').innerText = `Машин в гараже: ${gameState.carsOwned}`;     tg.HapticFeedback.impactOccurred('medium'); }  function claimBonus() {     const now = Date.now();     if (now - gameState.lastBonus > 86400000) { // 24 часа         gameState.balance += 5000;         gameState.lastBonus = now;         updateUI();         tg.showAlert("Вы получили 5 000 ₽!");     } else {         tg.showAlert("Бонус доступен только раз в сутки!");     } }  function openCase(type) {     if (gameState.balance < prices[type]) {         tg.showAlert("Недостаточно средств!");         return;     }      gameState.balance -= prices[type];     updateUI();      const overlay = document.getElementById('overlay');     const strip = document.getElementById('strip');     const spinner = document.getElementById('spinner-container');     const resultCard = document.getElementById('result-card');      overlay.style.display = 'flex';     spinner.style.display = 'block';     resultCard.style.display = 'none';     strip.innerHTML = '';     strip.style.transition = 'none';     strip.style.transform = 'translateX(0)';      // Генерируем ленту для анимации     const items = [];     for (let i = 0; i < 40; i++) {         const pool = carDatabase[type];         const rand = Math.random() * 100;         let cumulative = 0;         let selected = pool[0];          for (const car of pool) {             cumulative += car.chance;             if (rand <= cumulative) {                 selected = car;                 break;             }         }         items.push(selected);          const div = document.createElement('div');         div.className = `strip-item ${selected.rarity}`;         div.innerHTML = selected.emoji;         div.setAttribute('data-rarity', selected.rarity);         strip.appendChild(div);     }      // Выбираем "выигрышный" элемент (35-й в ленте)     const winningIndex = 35;     const winner = items[winningIndex];      setTimeout(() => {         strip.style.transition = 'transform 4s cubic-bezier(0.1, 0, 0.1, 1)';         const offset = (winningIndex * 100) - (150 - 50); // Центрирование         strip.style.transform = `translateX(-${offset}px)`;     }, 100);      // Показ результата     setTimeout(() => {         spinner.style.display = 'none';         resultCard.style.display = 'block';         document.getElementById('result-emoji').innerText = winner.emoji;         document.getElementById('result-name').innerText = winner.name;         const rarityDiv = document.getElementById('result-rarity');         rarityDiv.innerText = winner.rarity;         rarityDiv.className = `rarity-text ${winner.rarity}`;          gameState.carsOwned++;         updateUI();         tg.HapticFeedback.notificationOccurred('success');     }, 4200); }  function closeOverlay() {     document.getElementById('overlay').style.display = 'none'; }  // Запуск updateUI();
